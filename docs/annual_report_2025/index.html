<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annual Reading Report 2025</title>
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app" class="main-container">
        <div class="input-group">
            <input class="search-input" v-model="query" @keyup.enter="searchBook" placeholder="输入书名搜索，回车确认">
            <button class="btn-search" @click="searchBook" :disabled="loading">
                {{ loading ? '...' : '🔍' }}
            </button>

            <button class="btn-upload">
                📂
                <input type="file" accept="image/*" multiple @change="handleFileUpload">
            </button>

            <button class="btn-export" @click="exportImage" :disabled="exporting">
                {{ exporting ? '生成中...' : '🖼️' }}
            </button>

            <button class="btn-archive" @click="exportArchive" title="导出存档(JSON)">
                💾
            </button>

            <button class="btn-upload" title="导入存档(JSON)">
                📥
                <input type="file" accept="application/json" @change="importArchive" data-html2canvas-ignore>
            </button>

            <a href="en.html" class="btn-lang" title="Switch to English Version">
                EN
            </a>
        </div>

        <!-- 📸 Poster Area Start -->
        <div id="poster" class="poster">
            <header class="header">
                <div class="title-container">
                    <div class="title-line">
                        <span class="title">{{ recapTitle }}</span>
                        <span class="title-controls" data-html2canvas-ignore>
                            <select v-model="month" class="month-select">
                                <option value="/">月份：/（不显示）</option>
                                <option v-for="m in monthNames" :key="m" :value="m">{{ m }}</option>
                            </select>
                            <input type="text" v-model="year" class="year-input" placeholder="年份">
                            <button type="button" class="year-clear" @click="year = ''" title="清空年份（仅显示月份）">仅月份</button>
                        </span>
                    </div>
                    <div class="username-line">
                        <span class="at-name">@{{ username || 'YourName' }}</span>
                        <input type="text" v-model="username" placeholder="输入你的名字" class="name-input"
                            data-html2canvas-ignore>
                    </div>
                </div>
            </header>

            <div class="waterfall-wrap">
                <div class="waterfall">
                    <div v-for="(book, index) in myBooks" :key="book.id" class="book-card">
                        <!-- Delete button is hidden during export via CSS or logic if needed, but CSS hover handles it for UI -->
                        <div class="delete-btn" @click="removeBook(index)" data-html2canvas-ignore>×</div>
                        <img :src="book.cover" referrerPolicy="no-referrer" crossorigin="anonymous"
                            @error="handleImageError">
                        <!-- Book info deleted as per request -->
                    </div>
                </div>

                <div class="reading-stats">
                    <template v-if="!hideStats">
                        <div class="stats-main">
                            合计 <b>{{ stats.books }}</b> 本 · <b>{{ stats.words }}</b> 万字
                        </div>
                        <div class="stats-sub">
                            {{ stats.fiction }} 本虚构 · {{ stats.nonfiction }} 本非虚构 · {{ stats.female }} 本女作家
                        </div>
                    </template>
                    <div class="stats-controls" data-html2canvas-ignore>
                        <div class="stats-fields" v-if="!hideStats">
                            <label>本数<input type="number" min="0" step="1" v-model.number="stats.books"></label>
                            <label>万字<input type="number" min="0" step="0.1" v-model.number="stats.words"></label>
                            <label>虚构<input type="number" min="0" step="1" v-model.number="stats.fiction"></label>
                            <label>非虚构<input type="number" min="0" step="1" v-model.number="stats.nonfiction"></label>
                            <label>女作家<input type="number" min="0" step="1" v-model.number="stats.female"></label>
                            <button type="button" class="stats-refill" @click="refillStats" title="按上方所选月份重新填充数字">按月份重填</button>
                        </div>
                        <label class="stats-hide">
                            <input type="checkbox" v-model="hideStats"> 不显示此条目
                        </label>
                    </div>
                </div>
            </div>

            <footer class="poster-footer">
                <div class="footer-left">{{ recapTitle }}</div>
                <div class="footer-right">@{{ username || 'YourName' }} · {{ myBooks.length }} books</div>
            </footer>
        </div>
        <!-- 📸 Poster Area End -->

        <div v-if="showModal" class="modal-overlay" @click.self="showModal = false">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>选择版本</h3>
                    <button class="close-btn" @click="showModal = false">×</button>
                </div>
                <div class="search-results-list">
                    <div v-for="item in searchResults" :key="item.cover" class="result-item" @click="selectBook(item)">
                        <img :src="item.cover" referrerPolicy="no-referrer" @error="handleImageError">
                        <div class="result-title">{{ item.title }}</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="help-sidebar">
            <div class="help-trigger">
                <span class="icon">💡</span>
                <span class="text">使用<br>指南</span>
            </div>
            <div class="help-popover" v-if="helpData.length > 0">
                <div class="help-item" v-for="(item, index) in helpData" :key="index">
                    <div class="help-title">{{ item.title }}</div>
                    <div class="help-content">{{ item.content }}</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, reactive, computed, nextTick, onMounted } = Vue;

        createApp({
            setup() {
                const query = ref('');
                const loading = ref(false);
                const exporting = ref(false);
                const myBooks = ref([]);
                const searchResults = ref([]);

                // 生成会话内唯一 id，作为 v-for 的 key。
                // 用单调递增计数器，避免 Date.now() 在快速连续添加时重复，
                // 重复的 key 会让 Vue 的列表 diff 出错：拖动时封面重复出现、或某张卡片“拖不动”。
                let __uidSeq = 0;
                const uid = () => `${Date.now().toString(36)}-${(++__uidSeq).toString(36)}`;
                const showModal = ref(false);
                const username = ref(''); // Default empty or user can enter
                const helpData = ref([]);

                // 标题：可自选年份 / 月份（月份用英文，"/" 表示只显示年份）
                const monthNames = [
                    'January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'
                ];
                const year = ref('2026');
                const month = ref('June'); // "/" => 仅显示年份
                const recapTitle = computed(() => {
                    const y = String(year.value || '').trim();
                    const hasMonth = month.value && month.value !== '/';
                    const hasYear = y && y !== '/';
                    // 月份在前、年份在后，任一为空则省略，留空则只显示 "Reading Recap"
                    const prefix = [hasMonth ? month.value : '', hasYear ? y : '']
                        .filter(Boolean).join(' ');
                    return prefix ? `${prefix} Reading Recap` : 'Reading Recap';
                });

                // 阅读数据统计（来自《阅读记录（2026版）》2026年 sheet，按月份汇总）
                // 字段：books 本数 / words 字数(万字) / fiction 虚构 / nonfiction 非虚构 / female 女作家
                const monthlyStats = {
                    January: { books: 10, words: 163.57, fiction: 6, nonfiction: 4, female: 6 },
                    February: { books: 12, words: 181.08, fiction: 4, nonfiction: 8, female: 10 },
                    March: { books: 9, words: 87.44, fiction: 5, nonfiction: 4, female: 7 },
                    April: { books: 7, words: 71.9, fiction: 2, nonfiction: 5, female: 7 },
                    May: { books: 6, words: 73.31, fiction: 4, nonfiction: 2, female: 4 },
                    June: { books: 16, words: 226.6, fiction: 11, nonfiction: 5, female: 13 },
                    July: { books: 13, words: 180.42, fiction: 3, nonfiction: 10, female: 10 }
                };
                // 按选中月份 / 全年汇总出一组数据，作为手动输入的默认值
                const computeMonthStats = () => {
                    const acc = { books: 0, words: 0, fiction: 0, nonfiction: 0, female: 0 };
                    const add = (s) => { for (const k in acc) acc[k] += (s[k] || 0); };
                    if (month.value && month.value !== '/' && monthlyStats[month.value]) {
                        add(monthlyStats[month.value]);          // 指定月份
                    } else {
                        Object.values(monthlyStats).forEach(add); // 仅年份 / 未匹配 → 全年汇总
                    }
                    acc.words = Math.round(acc.words * 100) / 100;
                    return acc;
                };
                // 统计数字改为手动输入：初始用月份数据带出，之后可自由编辑
                const stats = reactive(computeMonthStats());
                const hideStats = ref(false);                       // 「不显示此条目」
                // 便捷按钮：按当前所选月份重新填充（不会在换月份时自动覆盖手动值）
                const refillStats = () => Object.assign(stats, computeMonthStats());

                const WORKER_URL = 'https://falling-sun-969d.sparrowz0116.workers.dev/';

                const searchBook = async () => {
                    if (!query.value.trim()) return;
                    loading.value = true;

                    try {
                        const response = await fetch(`${WORKER_URL}?q=${encodeURIComponent(query.value)}`);
                        const data = await response.json();

                        if (data && data.length > 0) {
                            searchResults.value = data;
                            showModal.value = true;
                        } else {
                            alert('没有找到这本书，试着换个关键词（可以试一下副标题或原作名），或者直接上传图片吧！');
                        }
                    } catch (err) {
                        console.error(err);
                        alert('搜索出错了');
                    } finally {
                        loading.value = false;
                    }
                };

                const selectBook = (bookItem) => {
                    myBooks.value.push({
                        id: uid(),
                        title: bookItem.title,
                        cover: bookItem.cover
                    });
                    showModal.value = false;
                    query.value = '';
                    searchResults.value = [];
                };

                const handleFileUpload = (event) => {
                    const files = Array.from(event.target.files || []);
                    if (!files.length) return;

                    files.forEach((file) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            myBooks.value.push({
                                id: uid(),
                                title: '自定义上传',
                                cover: e.target.result
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                    event.target.value = '';
                };

                const removeBook = (index) => {
                    myBooks.value.splice(index, 1);
                };

                const handleImageError = (e) => {
                    const img = e.target;
                    const currentSrc = img.src;

                    if (currentSrc.includes('/l/public/')) {
                        img.src = currentSrc.replace('/l/public/', '/s/public/');
                    }
                    else {
                        img.src = 'https://via.placeholder.com/150x220?text=No+Cover';
                    }
                    img.onerror = null;
                };

                const initDragSort = async () => {
                    await nextTick();
                    const el = document.querySelector('.waterfall');
                    if (!el || el.__sortable_inited) return;

                    el.__sortable_inited = true;

                    new Sortable(el, {
                        animation: 150,
                        ghostClass: 'drag-ghost',
                        chosenClass: 'drag-chosen',
                        dragClass: 'drag-dragging',

                        // 建议：只允许拖拽封面图片，避免误点删除按钮
                        handle: 'img',
                        filter: '.delete-btn, input, button',
                        preventOnFilter: true,

                        onEnd: (evt) => {
                            const { oldIndex, newIndex, item, from } = evt;
                            if (oldIndex === newIndex) return;

                            // 先撤销 Sortable 对真实 DOM 的移动，交由 Vue 依据数据重新渲染，
                            // 否则 DOM 已移动 + 数组再变更会让 keyed diff 产生重复封面。
                            if (newIndex > oldIndex) {
                                from.insertBefore(item, from.children[oldIndex]);
                            } else {
                                from.insertBefore(item, from.children[oldIndex + 1]);
                            }

                            const arr = myBooks.value;
                            const [moved] = arr.splice(oldIndex, 1);
                            arr.splice(newIndex, 0, moved);
                        }
                    });
                };

                // 🟢 导出图片功能
                const exportImage = async () => {
                    if (myBooks.value.length === 0) {
                        alert('先加几本书再导出吧~');
                        return;
                    }
                    exporting.value = true;

                    await nextTick();

                    // 获取要截图的区域
                    const element = document.getElementById('poster');

                    // 保存原有样式
                    const originalPadding = element.style.padding;
                    const originalBackground = element.style.background;
                    const originalBorder = element.style.border;

                    // 临时应用背景样式 (纯米白 + 边框) 以便截图
                    element.style.padding = '40px';
                    element.style.background = '#fdfcf8'; // 偏米白
                    element.style.border = '12px solid #e0dfd8'; // 外侧框线

                    try {
                        const canvas = await html2canvas(element, {
                            scale: 2, // 提高清晰度
                            useCORS: true, // 允许跨域图片
                            allowTaint: true,
                            backgroundColor: null, // 我们已经设置了 element background
                            ignoreElements: (element) => {
                                // 忽略带有 data-html2canvas-ignore 属性的元素
                                return element.hasAttribute('data-html2canvas-ignore');
                            }
                        });

                        const link = document.createElement('a');
                        link.download = '我的年度书单.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    } catch (err) {
                        console.error('Export failed:', err);
                        alert('导出图片失败，可能是图片跨域问题。建议直接截图保存。');
                    } finally {
                        // 恢复样式
                        element.style.padding = originalPadding;
                        element.style.background = originalBackground;
                        element.style.border = originalBorder;
                        exporting.value = false;
                    }
                };

                const ARCHIVE_SCHEMA = 'moon-night-reading-archive';
                const ARCHIVE_VERSION = 1;

                const downloadJson = (obj, filename) => {
                    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                };

                const exportArchive = () => {
                    const archive = {
                        schema: ARCHIVE_SCHEMA,
                        version: ARCHIVE_VERSION,
                        savedAt: new Date().toISOString(),
                        username: username.value || '',
                        stats: { ...stats },
                        hideStats: hideStats.value,
                        books: myBooks.value.map((b, i) => ({
                            id: b.id,
                            title: b.title || '',
                            cover: b.cover,   // URL 或 dataURL（你上传封面就是 dataURL）
                            order: i
                        }))
                    };

                    const safeName = (username.value || 'YourName').replace(/[^\w-]+/g, '_');
                    downloadJson(archive, `reading-archive-2025-${safeName}.json`);
                };

                const importArchive = (event) => {
                    const file = event.target.files?.[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = () => {
                        try {
                            const data = JSON.parse(String(reader.result || '{}'));

                            if (data.schema !== ARCHIVE_SCHEMA) {
                                alert('这不是本项目的存档文件（schema 不匹配）');
                                return;
                            }
                            if (!Array.isArray(data.books)) {
                                alert('存档格式不正确：books 缺失');
                                return;
                            }

                            // 恢复
                            username.value = data.username || '';
                            if (data.stats && typeof data.stats === 'object') {
                                for (const k of ['books', 'words', 'fiction', 'nonfiction', 'female']) {
                                    if (data.stats[k] !== undefined && data.stats[k] !== null) stats[k] = data.stats[k];
                                }
                            }
                            if (typeof data.hideStats === 'boolean') hideStats.value = data.hideStats;
                            myBooks.value = data.books
                                .slice()
                                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
                                .map(b => ({
                                    id: uid(), // 始终重新分配唯一 id，避免旧存档里重复/缺失的 id 破坏拖拽
                                    title: b.title || '',
                                    cover: b.cover || ''
                                }));

                            alert('导入成功 ✅');
                        } catch (e) {
                            console.error(e);
                            alert('导入失败：JSON 解析错误');
                        }
                    };
                    reader.readAsText(file);

                    // 允许重复选择同一个文件也能触发 change
                    event.target.value = '';
                };

                onMounted(async () => {
                    try {
                        const response = await fetch('./help.json');
                        if (response.ok) {
                            helpData.value = await response.json();
                        }
                    } catch (error) {
                        console.warn('Help data load failed:', error);
                    }
                });

                initDragSort();
                return {
                    query, loading, exporting, myBooks, searchResults, showModal,
                    searchBook, selectBook, handleFileUpload, removeBook,
                    handleImageError, exportImage,
                    username,
                    helpData,
                    monthNames, year, month, recapTitle,
                    stats, hideStats, refillStats,
                    exportArchive,
                    importArchive
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
