<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与月言书 · 读书会档案</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #f5f0e8;
            --paper-dark: #ede7d9;
            --ink: #2a2318;
            --ink-light: #6b5f4e;
            --ink-faint: #a89880;
            --accent: #8b4513;
            --accent-light: #c4783a;
            --line: #d8cfc2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Noto Serif SC', serif;
            font-weight: 300;
            min-height: 100vh;
        }

        /* ── Header ── */
        .site-header {
            background: var(--ink);
            color: var(--paper);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--accent);
        }

        .site-logo {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.05em;
            color: var(--ink-faint);
        }

        .site-logo span {
            color: var(--paper);
            font-style: normal;
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        /* ── Layout ── */
        .page-wrap {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 24px 100px;
        }

        /* ── Hero ── */
        .hero {
            padding: 80px 0 56px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 48px;
        }

        .hero-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .hero-title {
            font-family: 'Lora', serif;
            font-size: 2.6rem;
            font-weight: 500;
            line-height: 1.25;
            margin-bottom: 20px;
        }

        .hero-desc {
            font-size: 0.95rem;
            line-height: 2;
            color: var(--ink-light);
            max-width: 560px;
        }

        /* ── List label ── */
        .list-label {
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--ink-faint);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .list-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        /* ── Gallery ── */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 40px 28px;
        }

        .poster-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .poster-frame {
            position: relative;
            aspect-ratio: 1414 / 2000;
            background: var(--ink);
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(42, 35, 24, 0.14);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .poster-card:hover .poster-frame {
            transform: translateY(-6px);
            box-shadow: 0 16px 36px rgba(42, 35, 24, 0.26);
        }

        .poster-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .poster-vol {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            background: rgba(42, 35, 24, 0.82);
            color: var(--paper);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.1em;
            padding: 4px 9px;
            border-radius: 2px;
        }

        /* 海报缺失时的占位块 */
        .poster-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 32%, var(--paper-dark), var(--paper));
        }

        .poster-fallback .fb-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.5;
            color: var(--ink);
        }

        .poster-fallback .fb-note {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .poster-fallback::before {
            content: '';
            width: 26px;
            height: 1px;
            background: var(--accent);
        }

        .poster-meta {
            padding: 14px 2px 0;
        }

        .poster-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.08rem;
            font-weight: 500;
            line-height: 1.45;
            color: var(--ink);
        }

        .poster-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.64rem;
            color: var(--ink-faint);
            letter-spacing: 0.08em;
            margin-top: 7px;
        }

        .state-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--ink-faint);
            letter-spacing: 0.08em;
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 1.9rem;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 26px 16px;
            }

            .poster-title {
                font-size: 0.95rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--paper-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--ink-faint);
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="site-logo">与月言书 · 读书会档案</div>
        <div class="header-tag">ARCHIVE</div>
    </header>

    <div class="page-wrap">

        <section class="hero">
            <div class="hero-eyebrow">与月言书 · 线上共读</div>
            <h1 class="hero-title">读书会档案</h1>
            <p class="hero-desc">
                每一次共读，都是一群人围着一本书，把各自的生活也摊开来读。这里收录每一期的语音记录与文字书评，留作往后的回声。
            </p>
        </section>

        <div class="list-label">全部期次</div>
        <div class="gallery" id="epList">
            <div class="state-msg" id="stateMsg">加载中…</div>
        </div>

    </div>

    <script>
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function loadEpisodes() {
            const list = document.getElementById('epList');
            const msg = document.getElementById('stateMsg');
            try {
                const res = await fetch('./episodes.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const eps = await res.json();

                // 新的排在前面
                eps.sort((a, b) => b.vol - a.vol);

                msg.remove();
                const frag = document.createDocumentFragment();
                eps.forEach(ep => {
                    const volStr = 'Vol.' + String(ep.vol).padStart(2, '0');
                    const dateStr = (ep.date || '').replace(/-/g, ' · ');
                    // 海报约定：./posters/<slug>.jpg，缺失则显示占位块
                    const poster = ep.poster
                        ? `./posters/${ep.poster}`
                        : `./posters/${ep.slug}.jpg`;
                    const title = escHtml(ep.title);

                    const a = document.createElement('a');
                    a.className = 'poster-card';
                    a.href = `./episodes/${ep.slug}/index.html`;
                    a.innerHTML = `
                        <div class="poster-frame">
                            <span class="poster-vol">${volStr}</span>
                            <img src="${poster}" alt="${title} 海报" loading="lazy"
                                 onerror="this.style.display='none';this.parentElement.querySelector('.poster-fallback').style.display='flex';">
                            <div class="poster-fallback" style="display:none">
                                <div class="fb-title">${title}</div>
                                <div class="fb-note">海报待补</div>
                            </div>
                        </div>
                        <div class="poster-meta">
                            <div class="poster-title">${title}</div>
                            <div class="poster-date">${dateStr}</div>
                        </div>
                    `;
                    frag.appendChild(a);
                });
                list.appendChild(frag);
            } catch (err) {
                msg.textContent = `期次列表加载失败：${err.message}`;
                console.error(err);
            }
        }

        loadEpisodes();
    </script>
</body>

</html>
